name: Docker PR Build

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          pull: true
          load: true
          tags: game-thumbs:pr-check
      - name: Verify runtime and native modules
        run: |
          docker run --rm --platform '${{ matrix.platform }}' --entrypoint node game-thumbs:pr-check -e '
            const [major, minor, patch] = process.versions.node.split(".").map(Number);
            if (major !== 24 || minor < 22 || (minor === 22 && patch < 1)) {
              throw new Error(`Unexpected or vulnerable Node version: ${process.version}`);
            }
            require("canvas");
            require("sharp");
            console.log(`Node ${process.version}, native modules loaded`);
          '
